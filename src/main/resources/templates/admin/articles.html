<!DOCTYPE html>
<!--
  文章管理页 —— 后台的首页。

  和静态版（manage.html）看着像，但拿到的东西完全不同：
  manage.html 拿到的是一个空壳，内容靠浏览器发 17 个请求再去拼；
  这个页面拿到手时，表格里的每一行、每个作者名都已经是最终内容了，
  右键"查看网页源代码"能看到文章标题就写死在 HTML 里。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<!-- th:replace 把 layout.html 里的 head 片段搬过来，同时把标题参数传进去 -->
<head th:replace="~{admin/layout :: head('文章管理')}"></head>

<body>

<nav th:replace="~{admin/layout :: nav('articles')}"></nav>

<main class="adm-wrap">

    <div th:replace="~{admin/layout :: flash}"></div>

    <div class="adm-toolbar">
        <div class="adm-toolbar-info">
            共 <b th:text="${pageData.total}">0</b> 篇文章，
            第 <b th:text="${pageData.page}">1</b> / <b th:text="${pageData.totalPages}">1</b> 页
        </div>
        <a class="btn btn-primary btn-sm" th:href="@{/admin/articles/new}">写新文章</a>
    </div>

    <table class="adm-table">
        <thead>
        <tr>
            <th style="width: 58px">ID</th>
            <th>标题</th>
            <th style="width: 108px">作者</th>
            <th style="width: 108px">分类</th>
            <th style="width: 66px">浏览</th>
            <th style="width: 178px">发布时间</th>
            <th style="width: 142px">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${pageData.list}">
            <td class="adm-soft" th:text="${a.articleId}">1</td>

            <td>
                <!-- 标题点开是前台的详情页，开新标签，免得看完还得点回来 -->
                <a class="adm-title" target="_blank"
                   th:href="@{/post.html(id=${a.articleId})}"
                   th:text="${a.title}">文章标题</a>
            </td>

            <!--
              作者名和分类名都是"按 ID 去映射里查"。
              ${userNames[a.userId]} 取不到时是 null，后面紧跟的 ?: 就是
              "如果是 null 就用另一个值"，这里给个占位符，免得表格里出现空白格。
            -->
            <td th:text="${userNames[a.userId]} ?: '—'">hexin</td>

            <!--
              分类和作者不一样，得先判空再查映射，不能只靠 ?:。

              category_id 在库里是允许为 NULL 的（表示"未分类"），而 SpringEL 用
              **null 当下标**去取 Map 会直接抛 IllegalStateException: No index，
              那个 ?: 根本没机会生效 —— ?: 管的是"查出来是 null"，管不了"压根没法查"。
              结果就是只要有任意一篇未分类的文章排在第一页，整个页面 500。

              所以顺序反过来：先看 categoryId 是不是 null，是就写死"未分类"，
              不是才去查映射。
            -->
            <td th:text="${a.categoryId == null ? '未分类' : categoryNames[a.categoryId]}">学习笔记</td>

            <td class="adm-soft" th:text="${a.viewCount}">0</td>

            <!--
              时间格式化。LocalDateTime 直接输出会带着个 T（2026-09-22T19:55:12），
              这里把那一个字母换成空格，看着就是正常的日期时间了。

              加 adm-nowrap 是因为：表头里写的 width 只是个建议，
              表格默认的布局方式会根据内容重新分配列宽，
              于是这列被压窄、日期和时间折成了两行。禁止折行才是真管用的那个办法，
              浏览器会反过来把列撑到够宽。
            -->
            <td class="adm-soft adm-nowrap"
                th:text="${#strings.replace(a.createTime, 'T', ' ')}">2026-09-22 19:55:12</td>

            <td class="adm-actions">
                <a class="btn btn-sm" th:href="@{/admin/articles/{id}/edit(id=${a.articleId})}">编辑</a>

                <!--
                  删除必须用 POST，不能做成一个链接（<a href>）：
                  链接发的是 GET 请求，而 GET 应该只用来"看"，
                  不该改变数据 —— 否则浏览器预加载、搜索引擎爬一遍，
                  都会把数据删掉。表单提交天然就是 POST，正合适。

                  另外加了一句 confirm 让用户确认一下，删错了没法撤销。
                -->
                <form method="post" class="adm-inline"
                      th:action="@{/admin/articles/{id}/delete(id=${a.articleId})}"
                      onsubmit="return confirm('确定删除这篇文章吗？它的评论和标签关联也会一并删掉。');">
                    <button class="btn btn-danger btn-sm" type="submit">删除</button>
                </form>
            </td>
        </tr>

        <!-- 一篇都没有时给个提示，否则表格是一片空白，看着像页面坏了 -->
        <tr th:if="${pageData.list.isEmpty()}">
            <td colspan="7" class="adm-empty">还没有文章，点右上角「写新文章」发一篇。</td>
        </tr>
        </tbody>
    </table>

    <!--
      分页条。只有超过一页时才画（totalPages > 1），
      一页装得下的时候画出来反而是干扰。

      页码用 #numbers.sequence(1, n) 生成 1 到 n 的序列，
      比在后端造一个 List 传过来省事。
    -->
    <nav class="adm-pager" th:if="${pageData.totalPages > 1}">
        <a class="adm-page" th:classappend="${pageData.hasPrev ? '' : 'disabled'}"
           th:href="@{/admin/articles(page=${pageData.page - 1})}">‹ 上一页</a>

        <a th:each="p : ${#numbers.sequence(1, pageData.totalPages)}"
           class="adm-page"
           th:classappend="${p == pageData.page ? 'active' : ''}"
           th:href="@{/admin/articles(page=${p})}"
           th:text="${p}">1</a>

        <a class="adm-page" th:classappend="${pageData.hasNext ? '' : 'disabled'}"
           th:href="@{/admin/articles(page=${pageData.page + 1})}">下一页 ›</a>
    </nav>

</main>

</body>
</html>
