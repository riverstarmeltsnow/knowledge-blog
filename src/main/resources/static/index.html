<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识博客 · 首页</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== 顶部导航 ==================== -->
<header class="nav">
    <div class="nav-inner">
        <a class="brand" href="index.html">知识博客<span class="brand-dot">.</span></a>

        <nav class="nav-links">
            <a class="nav-link active" href="index.html">首页</a>
            <a class="nav-link" href="browse.html">分类与标签</a>
            <a class="nav-link" href="archive.html">归档</a>
            <a class="nav-link" href="manage.html">管理</a>
        </nav>

        <div class="nav-right">
            <!-- 用 form 包起来是为了能直接按回车提交，不用手写键盘事件 -->
            <form class="search-box" id="searchForm">
                <input type="text" id="searchInput" placeholder="搜索文章标题…" autocomplete="off">
                <button type="submit" title="搜索">搜索</button>
            </form>

            <div class="who" id="who"></div>
        </div>
    </div>
</header>

<!-- ==================== 正文 ==================== -->
<main class="layout">
    <div class="page-head">
        <h1 class="page-title" id="pageTitle">最新文章</h1>
        <p class="page-sub" id="pageSub"></p>
    </div>

    <!-- 三个档位的切换条。内容由 renderTabs() 填，
         复用后台管理页那套 .admin-tabs 样式，不另外写一份 -->
    <div class="admin-tabs" id="feedTabs"></div>

    <div id="listArea">
        <div class="loading">正在加载…</div>
    </div>

    <div class="pager" id="pager"></div>
</main>

<script src="js/common.js"></script>
<script>
    /**
     * 首页 —— 文章列表 + 搜索 + 翻页。
     *
     * 这一页有三种状态，靠 URL 参数区分：
     *   搜索状态：有 keyword 参数，调 /article/search 一次拿全，不显示页码条
     *   普通状态：有（或没有）sort 参数，分页拉一页，显示页码条
     *     sort = latest（默认）→ /article/page       最新
     *     sort = hot           → /article/hot        热门
     *     sort = recommend     → /article/recommend  推荐
     *
     * 三种状态都记在 URL 上而不是 JS 变量里，是为了刷新页面还在原处，
     * 也能把链接直接发给别人。切换档位就是改地址栏（location.href），
     * 和「分类与标签」页挑分类用的是同一招。
     */

    /** 每页显示几篇 */
    const PAGE_SIZE = 8;

    /** 三个档位。写成一个对象是为了让标题、副标题、空状态文案都放一处，
     *  不用在下面的分支里散落一堆 if */
    const FEEDS = {
        latest: {
            name: '最新',
            title: '最新文章',
            emptyText: '这里还空着',
            emptyHint: '去「管理」页面写下第一篇吧'
        },
        hot: {
            name: '热门',
            title: '热门文章',
            emptyText: '还没有人发表文章',
            emptyHint: '等有人写了文章，这里会按浏览量从高到低排出来'
        },
        recommend: {
            name: '推荐',
            title: '推荐关注',
            emptyText: '还没有关注任何人',
            emptyHint: '在文章详情页点作者名字旁边的「关注」，这里就会出现他的文章'
        }
    };

    /** 这一页要用到的数据 */
    const state = {
        page: 1,          // 当前第几页
        sort: 'latest',   // 当前是哪个档位：latest / hot / recommend
        keyword: '',      // 搜索关键字，空字符串表示不是搜索状态
        users: [],        // 全部用户，用来把 userId 显示成用户名
        categories: [],   // 全部分类，用来把 categoryId 显示成分类名
        followedIds: []   // 我关注了谁（一串用户ID），用来给卡片打「已关注」标
    };

    // ==================== 启动 ====================

    async function init() {
        // 从地址栏读状态
        const params = new URLSearchParams(location.search);
        state.keyword = params.get('keyword') || '';

        // 档位只认三个已知值，其它的（比如手打 ?sort=xxx）一律当"最新"。
        // 不校验的话，会拿着一个后端不认识的值去拼 URL，报一堆看不懂的错
        const sort = params.get('sort');
        state.sort = FEEDS[sort] ? sort : 'latest';

        if (state.keyword) {
            $('#searchInput').value = state.keyword;
        }

        try {
            // 这三个请求互不依赖，用 Promise.all 一起发，比一个个等快
            const [users, categories] = await Promise.all([
                get('/user/list'),
                get('/category/list')
            ]);
            state.users = users;
            state.categories = categories;
        } catch (e) {
            toast('加载基础数据失败：' + e.message, 'err');
            return;
        }

        renderLoginState('#who');
        initSearchBox();

        // 关注列表要单独请求 —— 它只在登录之后才有意义。
        // 没登录时不发这个请求，state.followedIds 保持空数组，
        // 卡片上自然就不会出现「已关注」。
        const me = getMe();
        if (me) {
            try {
                state.followedIds = await get('/follow/following/' + me.userId);
            } catch (e) {
                // 拿不到关注列表不算致命 —— 页面照样能看，
                // 只是卡片上少个标记，所以这里不打断整个初始化
                state.followedIds = [];
            }
        }

        renderTabs();
        await loadPosts();
    }

    // ==================== 档位切换条 ====================

    /**
     * 画「热门 / 最新 / 推荐」三个标签。
     *
     * 搜索状态下不显示 —— 搜索结果和这三个档位是两回事，
     * 摆在搜索结果上面会让人以为换档位能筛搜索结果，其实不能。
     */
    function renderTabs() {
        const box = $('#feedTabs');

        if (state.keyword) {
            box.innerHTML = '';
            return;
        }

        box.innerHTML = ['hot', 'latest', 'recommend'].map(key =>
            '<button class="admin-tab' + (state.sort === key ? ' active' : '') + '"'
            + ' type="button" onclick="pickSort(\'' + key + '\')">'
            + FEEDS[key].name + '</button>'
        ).join('');
    }

    /**
     * 切到某个档位。
     *
     * 走"改地址栏"而不是直接改 state 再重画，是因为这样刷新之后
     * 还停在同一个档位，链接也能直接分享。"最新"是默认档，
     * URL 上不带 sort 参数，地址干净一点。
     *
     * 写在全局是为了让标签按钮的 onclick 能调到。
     *
     * @param {string} sort 'latest' / 'hot' / 'recommend'
     */
    function pickSort(sort) {
        location.href = 'index.html' + (sort === 'latest' ? '' : '?sort=' + sort);
    }

    // ==================== 加载文章列表 ====================

    async function loadPosts() {
        const area = $('#listArea');
        area.innerHTML = '<div class="loading">正在加载…</div>';

        try {
            if (state.keyword) {
                await loadSearchResult(area);
            } else {
                await loadPagedPosts(area);
            }
        } catch (e) {
            area.innerHTML = emptyHtml('加载失败：' + e.message, '检查一下后端是不是还开着', '⚠');
            $('#pager').innerHTML = '';
        }
    }

    /** 搜索状态：一次拿全部结果 */
    async function loadSearchResult(area) {
        const posts = await get(withQuery('/article/search', { keyword: state.keyword }));

        $('#pageTitle').textContent = '搜索「' + state.keyword + '」';
        $('#pageSub').textContent = '找到 ' + posts.length + ' 篇匹配的文章';

        if (!posts.length) {
            area.innerHTML = emptyHtml('没有找到包含这个关键字的文章',
                '试试换个词，或者点下面的按钮看全部文章');
        } else {
            area.innerHTML = articleListHtml(posts, state.users, state.categories, state.followedIds);
        }

        // 搜索不分页，只给一个"回到全部"的出口
        $('#pager').innerHTML =
            '<button class="pager-btn" onclick="backToAll()">← 返回全部文章</button>';
    }

    /** 普通状态：按当前档位拉一页 */
    async function loadPagedPosts(area) {
        const feed = FEEDS[state.sort];

        // 「推荐」的两个特殊情况和"热门/最新"不一样，先处理掉
        const shortcut = recommendShortcut(feed, area);
        if (shortcut) {
            return;
        }

        const result = await get(withQuery(apiPathOf(), {
            page: state.page,
            size: PAGE_SIZE,
            // 只有推荐流需要带上"我是谁"。其余两个接口没有这个参数，
            // withQuery 会把值为 undefined 的项直接跳过，所以这里统一写上没事
            followerId: state.sort === 'recommend' ? getMe().userId : undefined
        }));

        $('#pageTitle').textContent = feed.title;

        // 一篇都没有时副标题留空 —— 空状态那块已经说清楚"为什么空、接下来干嘛"了，
        // 上面再挂一句"共 0 篇文章"是废话
        $('#pageSub').textContent = result.total > 0 ? '共 ' + result.total + ' 篇文章' : '';

        if (!result.list.length) {
            area.innerHTML = emptyHtml(feed.emptyText, feed.emptyHint);
            $('#pager').innerHTML = '';
            return;
        }

        area.innerHTML = articleListHtml(result.list, state.users, state.categories, state.followedIds);
        renderPager(result.page, result.totalPages);
    }

    /** 当前档位该调哪个接口 */
    function apiPathOf() {
        if (state.sort === 'hot') {
            return '/article/hot';
        }
        if (state.sort === 'recommend') {
            return '/article/recommend';
        }
        return '/article/page';
    }

    /**
     * 「推荐」档位下不发请求就能定的两种情况。
     *
     * 这两种都**不能**靠"请求失败了再显示错误"来处理 ——
     * 它们不是错误，是正常状态，只是需要一段引导告诉用户下一步干嘛。
     *
     * @returns {boolean} true 表示已经画完了，调用方不要再发请求
     */
    function recommendShortcut(feed, area) {
        if (state.sort !== 'recommend') {
            return false;
        }

        $('#pageTitle').textContent = feed.title;
        $('#pager').innerHTML = '';

        // 情况一：没登录。后端也会拒绝（推荐流必须知道"我是谁"），
        // 但让前端先拦一道，用户就不用先看到一个报错再被引导去登录
        if (!getMe()) {
            $('#pageSub').textContent = '';
            area.innerHTML = emptyHtml('登录后可以看推荐',
                '关注感兴趣的博主，他们的新文章会出现在这里。', '🔑');
            return true;
        }

        // 情况二：登录了，但一篇文章都没有。
        // 这里没有提前调 count，而是等下面正常请求回来之后看 total ——
        // 因为空的原因有两种（没关注人 / 关注的人还没写），
        // 文案要能同时说清楚，没必要为了区分它们多发一次请求
        return false;
    }

    // ==================== 渲染 ====================

    /** 画页码条 */
    function renderPager(current, totalPages) {
        const pager = $('#pager');

        // 只有一页就不用显示页码条了，纯属占地方
        if (totalPages <= 1) {
            pager.innerHTML = '';
            return;
        }

        let html = '<button class="pager-btn"' + (current <= 1 ? ' disabled' : '')
            + ' onclick="goPage(' + (current - 1) + ')">上一页</button>';

        pageNumbers(current, totalPages).forEach(item => {
            if (item === '...') {
                html += '<span class="pager-info">…</span>';
            } else {
                html += '<button class="pager-btn' + (item === current ? ' current' : '')
                    + '" onclick="goPage(' + item + ')">' + item + '</button>';
            }
        });

        html += '<button class="pager-btn"' + (current >= totalPages ? ' disabled' : '')
            + ' onclick="goPage(' + (current + 1) + ')">下一页</button>';

        html += '<span class="pager-info">第 ' + current + ' / ' + totalPages + ' 页</span>';

        pager.innerHTML = html;
    }

    /**
     * 算出页码条上要显示哪些数字。
     *
     * 页数少就全列出来；页数多就只列"当前页附近"的几个，
     * 中间断掉的地方用省略号顶上 —— 不然有 100 页时页码条会长到没边。
     */
    function pageNumbers(current, total) {
        if (total <= 7) {
            return Array.from({ length: total }, (_, i) => i + 1);
        }

        const pages = [1];
        const start = Math.max(2, current - 1);
        const end = Math.min(total - 1, current + 1);

        if (start > 2) {
            pages.push('...');
        }
        for (let i = start; i <= end; i++) {
            pages.push(i);
        }
        if (end < total - 1) {
            pages.push('...');
        }
        pages.push(total);

        return pages;
    }

    // ==================== 交互 ====================

    /** 翻到第几页。写在全局是为了让页码按钮的 onclick 能调到 */
    function goPage(page) {
        state.page = page;
        loadPosts();
        // 翻完页滚回顶部，否则用户还停在页面底部，看不到新内容
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /** 从搜索结果回到普通列表 */
    function backToAll() {
        location.href = 'index.html';
    }

    init();
</script>
</body>
</html>
