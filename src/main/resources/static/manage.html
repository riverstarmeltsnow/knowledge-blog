<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识博客 · 管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== 顶部导航 ==================== -->
<header class="nav">
    <div class="nav-inner">
        <a class="brand" href="index.html">知识博客<span class="brand-dot">.</span></a>

        <nav class="nav-links">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="browse.html">分类与标签</a>
            <a class="nav-link" href="archive.html">归档</a>
            <a class="nav-link active" href="manage.html">管理</a>
        </nav>

        <div class="nav-right">
            <form class="search-box" id="searchForm">
                <input type="text" id="searchInput" placeholder="搜索文章标题…" autocomplete="off">
                <button type="submit" title="搜索">搜索</button>
            </form>

            <div class="who" id="who"></div>
        </div>
    </div>
</header>

<main class="layout">
    <div class="page-head">
        <h1 class="page-title">管理后台</h1>
        <p class="page-sub" id="pageSub"></p>
    </div>

    <!-- 没登录时顶上挂一条提醒。登录状态只存在浏览器这头，
         接口本身是无状态的，前端能做的永远只是"提前说一声"；
         真正把关的是后端 —— 所有写接口都要求带上 operatorId，
         文章/评论/用户资料要"本人或管理员"，分类和标签要管理员 -->
    <div class="notice" id="notice" hidden></div>

    <!-- ==================== 标签页 ==================== -->
    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="article">文章</button>
        <button class="admin-tab" data-tab="category">分类</button>
        <button class="admin-tab" data-tab="tag">标签</button>
        <button class="admin-tab" data-tab="user">用户</button>
    </div>

    <!-- ---------- 文章 ---------- -->
    <section class="admin-panel active" id="panel-article">
        <div class="panel-head">
            <h2 class="panel-title">全部文章</h2>
            <button class="btn btn-primary" onclick="openArticleForm(null)">写新文章</button>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th style="width:56px">ID</th>
                <th>标题</th>
                <th style="width:100px">作者</th>
                <th style="width:100px">分类</th>
                <th style="width:74px">浏览量</th>
                <th style="width:110px">发表时间</th>
                <th style="width:120px">操作</th>
            </tr>
            </thead>
            <tbody id="articleRows"></tbody>
        </table>
    </section>

    <!-- ---------- 分类 ---------- -->
    <section class="admin-panel" id="panel-category">
        <div class="panel-head">
            <h2 class="panel-title">分类</h2>
            <!-- 分类没有主人，增删改只有管理员能做，所以这个按钮只给管理员看 -->
            <button class="btn btn-primary" data-admin-only
                    onclick="openCategoryForm(null)">新增分类</button>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th style="width:56px">ID</th>
                <th style="width:180px">名称</th>
                <th>描述</th>
                <th style="width:90px">文章数</th>
                <th style="width:120px">操作</th>
            </tr>
            </thead>
            <tbody id="categoryRows"></tbody>
        </table>
    </section>

    <!-- ---------- 标签 ---------- -->
    <section class="admin-panel" id="panel-tag">
        <div class="panel-head">
            <h2 class="panel-title">标签</h2>
            <!-- 同上：标签也是全站共用、没有主人的数据 -->
            <button class="btn btn-primary" data-admin-only
                    onclick="openTagForm(null)">新增标签</button>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th style="width:56px">ID</th>
                <th>名称</th>
                <th style="width:120px">操作</th>
            </tr>
            </thead>
            <tbody id="tagRows"></tbody>
        </table>
    </section>

    <!-- ---------- 用户 ---------- -->
    <section class="admin-panel" id="panel-user">
        <div class="panel-head">
            <h2 class="panel-title">用户</h2>
            <button class="btn btn-primary" onclick="openUserForm(null)">新增用户</button>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th style="width:56px">ID</th>
                <th style="width:150px">用户名</th>
                <th>邮箱</th>
                <th style="width:100px">角色</th>
                <th style="width:110px">注册时间</th>
                <th style="width:120px">操作</th>
            </tr>
            </thead>
            <tbody id="userRows"></tbody>
        </table>
    </section>
</main>

<!-- ==================== 通用弹窗 ==================== -->
<!-- 四个模块的新增/编辑共用这一个弹窗，靠 JS 换里面的表单。
     每个模块各做一个弹窗的话，光 HTML 就要多写两百行 -->
<div class="modal-mask" id="modalMask">
    <div class="modal">
        <h3 class="modal-title" id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="modal-foot">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modalSave">保存</button>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    /**
     * 管理后台 —— 文章 / 分类 / 标签 / 用户的增删改查。
     *
     * 这个页面做的事，说白了就是把后端那些接口挨个接上按钮，
     * 所以在数据这一层没什么花活儿：四个模块的数据一次性全拉下来，
     * 存进 state，之后增删改成功就重新拉一遍，页面永远显示数据库里的真实情况。
     *
     * 为什么每次都全量重拉、而不是在本地数组里改一改？
     * 因为后端的删除是有牵连的 —— 删一个分类会牵连它的文章、
     * 删一篇文章会带走评论和标签关联。本地改很容易漏掉这些连锁反应，
     * 显示出来的东西就跟数据库对不上了。多一次请求换个"所见即所得"，划算。
     */

    const state = {
        articles: [],
        categories: [],
        tags: [],
        users: []
    };

    /** 弹窗上那个"保存"按钮当前该干什么。由 openModal 换掉 */
    let modalSaveHandler = null;

    // ==================== 启动 ====================

    async function init() {
        await loadAll();

        renderLoginState('#who');
        initSearchBox();

        bindTabs();
        bindModal();
        updateNotice();
        applyRoleVisibility();

        // 从文章详情页点"编辑"跳过来时带着 ?edit=3，直接帮他打开那篇
        const editId = new URLSearchParams(location.search).get('edit');
        if (editId) {
            switchTab('article');
            await openArticleForm(Number(editId));
        }
    }

    /** 把四个模块的数据全拉一遍 */
    async function loadAll() {
        /*
         * 文章列表有两个接口，看登录状态选：
         *   没登录 → /article/list   只有已发布的
         *   登录了 → /article/manage 多出"自己的草稿"（管理员则多出所有人的草稿）
         *
         * 注意草稿是**后端在 SQL 里滤掉的**，不是前端拿到全部再藏起来。
         * 前端藏起来的那种做法等于把草稿的标题和ID发给了所有人，
         * 按 F12 就能看见 —— 那种"隐藏"不算隐藏。
         */
        const me = getMe();
        const articleRequest = me
            ? get(withQuery('/article/manage', { operatorId: me.userId }))
            : get('/article/list');

        try {
            const [articles, categories, tags, users] = await Promise.all([
                articleRequest,
                get('/category/list'),
                get('/tag/list'),
                get('/user/list')
            ]);
            state.articles = articles;
            state.categories = categories;
            state.tags = tags;
            state.users = users;
        } catch (e) {
            toast('加载数据失败：' + e.message, 'err');
            return;
        }

        renderAll();
    }

    function renderAll() {
        renderArticles();
        renderCategories();
        renderTags();
        renderUsers();

        $('#pageSub').textContent =
            state.articles.length + ' 篇文章 · '
            + state.categories.length + ' 个分类 · '
            + state.tags.length + ' 个标签 · '
            + state.users.length + ' 位用户';
    }

    /** 没登录时在页面顶部挂条提醒 */
    function updateNotice() {
        const notice = $('#notice');
        const me = getMe();

        if (me) {
            // 管理员不用提醒什么，他什么都能干
            if (me.role === 1) {
                notice.hidden = true;
                return;
            }
            notice.hidden = false;
            notice.innerHTML = '当前是普通用户。你能：发表和修改<b>自己的</b>文章、'
                + '给自己的文章贴标签、改自己的资料。'
                + '分类和标签是全站共用的字典数据，只有管理员能增删改。';
            return;
        }

        notice.hidden = false;
        notice.innerHTML = '还没有登录。右上角登录之后再操作，'
            + '否则所有写操作都会被后端拒绝 —— 因为后端需要知道"是谁在改"。';
    }

    /**
     * 按当前身份显示/隐藏那些"只有管理员能用"的按钮（页面上标了 data-admin-only 的）。
     *
     * 这一步<b>不是安全措施</b>，只是别让普通用户点了才发现不行 ——
     * 一个看得见却点不动的按钮，比干脆不显示更让人困惑。
     * 真正的把关在后端：这些按钮对应的接口会调 PermissionChecker.checkAdmin。
     */
    function applyRoleVisibility() {
        const admin = isAdmin();
        $$('[data-admin-only]').forEach(el => {
            el.hidden = !admin;
        });
    }

    // ==================== 标签页切换 ====================

    function bindTabs() {
        $$('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });
    }

    function switchTab(name) {
        $$('.admin-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.tab === name);
        });
        $$('.admin-panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === 'panel-' + name);
        });
    }

    // ==================== 弹窗 ====================

    function bindModal() {
        $('#modalSave').addEventListener('click', async () => {
            if (modalSaveHandler) {
                await modalSaveHandler();
            }
        });

        // 点遮罩空白处关闭。注意判断 target —— 不判断的话
        // 点弹窗里的任何地方都会冒泡到遮罩上，输入框根本点不进去
        $('#modalMask').addEventListener('click', event => {
            if (event.target === $('#modalMask')) {
                closeModal();
            }
        });

        // Esc 关闭
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });
    }

    /**
     * 打开弹窗。
     *
     * @param {string} title 标题
     * @param {string} bodyHtml 表单内容
     * @param {Function} onSave 点"保存"时执行；返回 Promise，抛异常就不关窗
     */
    function openModal(title, bodyHtml, onSave) {
        $('#modalTitle').textContent = title;
        $('#modalBody').innerHTML = bodyHtml;
        modalSaveHandler = onSave;
        $('#modalMask').classList.add('open');

        // 第一个输入框自动聚焦，省得每次都得先点一下
        const first = $('#modalBody input, #modalBody textarea');
        if (first) {
            first.focus();
        }
    }

    function closeModal() {
        $('#modalMask').classList.remove('open');
        $('#modalBody').innerHTML = '';
        modalSaveHandler = null;
    }

    /** 表单里的一行：标签 + 控件 */
    function field(label, controlHtml) {
        return '<div class="field"><label>' + label + '</label>' + controlHtml + '</div>';
    }

    /** 生成一个下拉框的 option 列表 */
    function optionsHtml(items, valueKey, labelKey, selected, emptyLabel) {
        let html = emptyLabel ? '<option value="">' + emptyLabel + '</option>' : '';
        html += items.map(item => {
            const value = item[valueKey];
            return '<option value="' + value + '"'
                + (value === selected ? ' selected' : '') + '>'
                + escapeHtml(item[labelKey]) + '</option>';
        }).join('');
        return html;
    }

    // ==================== 一、文章 ====================

    function renderArticles() {
        const tbody = $('#articleRows');

        if (!state.articles.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="table-empty">'
                + '还没有文章，点右上角"写新文章"发一篇</td></tr>';
            return;
        }

        tbody.innerHTML = state.articles.map(article => ''
            + '<tr>'
            +   '<td>' + article.articleId + '</td>'
            +   '<td><a href="post.html?id=' + article.articleId + '">'
            +     escapeHtml(article.title) + '</a>'
            // 草稿挂个角标。几十行里混着几篇没写完的，
            // 不给标记的话根本找不着哪篇是稿子
            +     (article.status === 0 ? ' <span class="draft-tag">草稿</span>' : '')
            +   '</td>'
            +   '<td>' + escapeHtml(userNameOf(state.users, article.userId)) + '</td>'
            +   '<td>' + (categoryNameOf(state.categories, article.categoryId) || '—') + '</td>'
            +   '<td>' + (article.viewCount || 0) + '</td>'
            +   '<td>' + formatTime(article.createTime) + '</td>'
            +   '<td class="row-actions">'
            // 只有作者本人和管理员能改这一行。没有权限就连按钮都不给 ——
            // 让人看得见却点不动，比干脆不显示更让人困惑。
            // 注意这只是"别让人白点一次"，真正拦越权的是后端
            +     (canTouch(article.userId)
                    ? '<button onclick="openArticleForm(' + article.articleId + ')">编辑</button>'
                      // 按钮文字跟着当前状态走：是草稿就显示"发布"，
                      // 已发布就显示"转为草稿"。同一个按钮两种含义，
                      // 但标签一直说清"点下去会变成什么"
                      + (article.status === 0
                            ? '<button onclick="togglePublish(' + article.articleId + ', 1)">发布</button>'
                            : '<button onclick="togglePublish(' + article.articleId + ', 0)">转为草稿</button>')
                      + '<button class="danger" onclick="deleteArticle(' + article.articleId + ')">删除</button>'
                    : '<span class="row-locked" title="只有作者本人和管理员能改">—</span>')
            +   '</td>'
            + '</tr>').join('');
    }

    /**
     * 打开文章的新增/编辑弹窗。
     *
     * @param {number|null} articleId 传 null 是新增，传ID是编辑
     */
    async function openArticleForm(articleId) {
        if (!state.users.length) {
            toast('还没有用户，先去"用户"页签加一个再发文章');
            return;
        }

        let article = { title: '', content: '', userId: '', categoryId: '' };

        if (articleId) {
            /*
             * 列表接口 /article/list 是不带正文的（列表页用不上，查出来白费流量），
             * 所以编辑时得单独去 /article/{id} 拿一次完整内容。
             *
             * ⚠️ 副作用：这个接口每调一次浏览量就 +1。也就是说，
             * 打开一次编辑弹窗，这篇文章的浏览量会平白多 1。
             * 想要不这样，得让后端再加一个"只读详情、不计数"的接口；
             * 对实验来说没必要，先这么用着，知道有这回事就行。
             */
            const me = getMe();
            try {
                // 带上 operatorId：草稿只有作者本人和管理员读得到，
                // 不带你自己的身份，后端连"这篇能不能给你看"都判不了
                article = await get(withQuery('/article/' + articleId,
                    me ? { operatorId: me.userId } : {}));
            } catch (e) {
                toast('读取文章失败：' + e.message, 'err');
                return;
            }
        }

        const body = ''
            + field('标题 *',
                '<input type="text" id="fTitle" maxlength="200" value="'
                + escapeHtml(article.title) + '">')
            + field('作者 *',
                '<select id="fUserId">'
                + optionsHtml(state.users, 'userId', 'username', article.userId, null)
                + '</select>')
            + field('分类',
                '<select id="fCategoryId">'
                + optionsHtml(state.categories, 'categoryId', 'name', article.categoryId, '（不分类）')
                + '</select>')
            + field('正文 * <span class="md-hint">支持 Markdown</span>',
                '<div class="md-toolbar">'
                // type="button" 不能省：不给的话它们默认是 submit，
                // 在表单里点一下就会把表单提交掉
                + '<button type="button" data-md="bold" title="粗体：**文字**">B</button>'
                + '<button type="button" data-md="italic" title="斜体：*文字*"><i>I</i></button>'
                + '<button type="button" data-md="heading" title="小标题：## 文字">H</button>'
                + '<button type="button" data-md="list" title="列表：- 文字">≣</button>'
                + '<button type="button" data-md="code" title="行内代码：`代码`">&lt;/&gt;</button>'
                + '<button type="button" data-md="link" title="链接：[文字](网址)">链接</button>'
                // 预览按钮单独靠右，和上面那些"插语法"的按钮区分开：
                // 上面的是改内容，这个是看内容
                + '<button type="button" id="mdPreviewBtn" class="md-preview-btn">预览</button>'
                + '</div>'
                + '<textarea id="fContent" rows="12" class="content-input">'
                + escapeHtml(article.content) + '</textarea>'
                + '<div id="mdPreview" class="markdown-body md-preview-pane" hidden></div>')
            // 新增的稿子 article.status 是 undefined（不是 0），
            // 所以这里用"是不是 0"来判断，默认落到"发布"上 ——
            // 发文章默认就是发出去，想要草稿得自己动手选
            + field('状态',
                '<select id="fStatus">'
                + '<option value="1"' + (article.status === 0 ? '' : ' selected') + '>发布</option>'
                + '<option value="0"' + (article.status === 0 ? ' selected' : '') + '>草稿</option>'
                + '</select>');

        openModal(articleId ? '编辑文章' : '写新文章', body, async () => {
            const me = getMe();
            if (!me) {
                toast('请先登录再操作', 'err');
                return;
            }

            const payload = {
                title: $('#fTitle').value.trim(),
                content: $('#fContent').value.trim(),
                userId: Number($('#fUserId').value),
                // 选了"（不分类）"时值是空串，得转成 null，
                // 否则后端拿到 0 会当成"分类ID是0"，报找不到分类
                categoryId: $('#fCategoryId').value ? Number($('#fCategoryId').value) : null,
                status: Number($('#fStatus').value)
            };

            try {
                if (articleId) {
                    payload.articleId = articleId;
                    // operatorId 放查询串里，和删除接口一个写法。
                    // 后端拿它判权限：只有作者本人和管理员能改这篇文章
                    await put(withQuery('/article/update', { operatorId: me.userId }), payload);
                } else {
                    await post('/article/add', payload);
                }
                toast(articleId ? '已保存'
                    : (payload.status === 0 ? '已存为草稿，只有你自己看得到' : '发表成功'), 'ok');
                closeModal();
                await loadAll();
            } catch (e) {
                toast(e.message, 'err');
            }
        });

        // 上面那句 openModal 已经把弹窗内容塞进 DOM 了，
        // 所以监听必须在这之后才挂得上（挂早了那些元素还不存在）
        initMarkdownEditor();
    }

    /**
     * 发布一篇草稿，或者把已发布的文章转回草稿。
     *
     * 这里直接复用 /article/update，没有单开一个"只改状态"的接口：
     * update 本来就管状态，多开一个接口就多一处要写权限判断的地方，
     * 漏掉任何一处都等于开了个后门。
     *
     * 代价是得先把正文取回来再整体提交（update 要求 title/content 必填）。
     * 另外取详情会让**已发布**文章的浏览量 +1 —— 这是详情接口本来就有的行为，
     * 见 openArticleForm 里的说明。草稿不受影响。
     *
     * @param {number} articleId 文章ID
     * @param {number} status    目标状态：1 = 发布，0 = 转回草稿
     */
    async function togglePublish(articleId, status) {
        const me = getMe();
        if (!me) {
            toast('请先登录 —— 后端要知道是谁在改');
            return;
        }

        try {
            const article = await get(
                withQuery('/article/' + articleId, { operatorId: me.userId }));

            await put(withQuery('/article/update', { operatorId: me.userId }), {
                articleId: articleId,
                title: article.title,
                content: article.content,
                userId: article.userId,
                categoryId: article.categoryId,
                status: status
            });

            toast(status === 1 ? '已发布' : '已转为草稿', 'ok');
            await loadAll();
        } catch (e) {
            toast(e.message, 'err');
        }
    }

    // ==================== Markdown 编辑器 ====================

    /**
     * 给正文输入框装工具条和预览按钮。
     * <p>
     * 工具条只干一件事：往光标处塞几个字符。它不解析、不渲染 ——
     * 就是帮你少敲两个星号而已。真正的渲染全在后端（见 MarkdownRenderer），
     * 预览走的也是那个接口，所以预览里长什么样，发出来就是什么样。
     */
    function initMarkdownEditor() {
        const box = $('#fContent');
        if (!box) {
            return;
        }

        document.querySelectorAll('#modalBody .md-toolbar button[data-md]')
            .forEach(btn => btn.addEventListener('click',
                () => applyMarkdownSnippet(box, btn.dataset.md)));

        $('#mdPreviewBtn').addEventListener('click',
            () => toggleMarkdownPreview(box, $('#mdPreviewBtn')));
    }

    /**
     * 往正文里插入一段 Markdown 语法。
     *
     * @param {HTMLTextAreaElement} box  正文输入框
     * @param {string} kind bold / italic / heading / list / code / link
     */
    function applyMarkdownSnippet(box, kind) {
        // 每种语法无非是"在选中内容前后各补一点东西"。
        // 没选中任何内容时就塞个占位词，免得留下一对空的标记
        // （**　** 这种，光标还卡在中间，看着像坏了）
        const SNIPPETS = {
            bold:    {before: '**', after: '**', placeholder: '粗体'},
            italic:  {before: '*',  after: '*',  placeholder: '斜体'},
            code:    {before: '`',  after: '`',  placeholder: '代码'},
            link:    {before: '[',  after: '](https://)', placeholder: '链接文字'},
            heading: {before: '## ', after: '',  placeholder: '小标题', byLine: true},
            list:    {before: '- ',  after: '',  placeholder: '列表项', byLine: true}
        };

        const s = SNIPPETS[kind];
        if (!s) {
            return;
        }

        const start = box.selectionStart;
        const end = box.selectionEnd;

        if (s.byLine) {
            // 标题和列表的前缀必须加在**行首**。
            // 光标停在一行中间时直接插在光标处，会得到 "正文## 小标题" 这种
            // 谁也不认识的东西。所以整行（或者选中的这几行）一起处理
            const from = lineStartOf(box.value, start);
            const to = lineEndOf(box.value, end);
            const block = box.value.slice(from, to) || s.placeholder;

            const prefixed = block.split('\n')
                .map(line => s.before + line)
                .join('\n');

            box.value = box.value.slice(0, from) + prefixed + box.value.slice(to);
            box.focus();
            box.setSelectionRange(from, from + prefixed.length);
            return;
        }

        const text = box.value.slice(start, end) || s.placeholder;
        box.value = box.value.slice(0, start) + s.before + text + s.after
            + box.value.slice(end);

        box.focus();
        // 选中刚插进去的那段，方便直接接着打字替换掉占位词
        box.setSelectionRange(start + s.before.length,
            start + s.before.length + text.length);
    }

    /** 光标位置所在那一行的开头下标 */
    function lineStartOf(text, pos) {
        return text.lastIndexOf('\n', pos - 1) + 1;
    }

    /** 光标位置所在那一行的末尾下标（不含换行符本身） */
    function lineEndOf(text, pos) {
        const nl = text.indexOf('\n', pos);
        return nl === -1 ? text.length : nl;
    }

    /**
     * 切换编辑 / 预览。
     * <p>
     * 预览是把正文发给后端的 /article/preview 渲染出来的，不是在前端
     * 再实现一遍 Markdown。两边用同一个渲染器，才不会出现
     * "预览里排得好好的、一发出来就不一样" 这种特别难查的问题。
     */
    async function toggleMarkdownPreview(box, btn) {
        const pane = $('#mdPreview');

        // 已经在预览状态了 → 切回编辑
        if (!pane.hidden) {
            pane.hidden = true;
            box.hidden = false;
            btn.textContent = '预览';
            btn.classList.remove('active');
            box.focus();
            return;
        }

        try {
            const html = await post('/article/preview', { content: box.value });
            pane.innerHTML = html || '<p class="md-empty">（正文还是空的）</p>';
            pane.hidden = false;
            box.hidden = true;
            btn.textContent = '继续编辑';
            btn.classList.add('active');
        } catch (e) {
            toast('预览失败：' + e.message, 'err');
        }
    }

    async function deleteArticle(articleId) {
        const me = getMe();
        if (!me) {
            toast('请先登录 —— 后端要知道是谁在删');
            return;
        }

        if (!confirm('确定删除这篇文章吗？\n它下面的评论和标签关联会一起删掉。')) {
            return;
        }

        try {
            await del(withQuery('/article/' + articleId, { operatorId: me.userId }));
            toast('已删除', 'ok');
            await loadAll();
        } catch (e) {
            toast(e.message, 'err');
        }
    }

    // ==================== 二、分类 ====================

    function renderCategories() {
        const tbody = $('#categoryRows');

        if (!state.categories.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="table-empty">还没有分类</td></tr>';
            return;
        }

        // 顺带数一下每个分类下有几篇文章
        const counts = {};
        state.articles.forEach(article => {
            if (article.categoryId) {
                counts[article.categoryId] = (counts[article.categoryId] || 0) + 1;
            }
        });

        tbody.innerHTML = state.categories.map(category => ''
            + '<tr>'
            +   '<td>' + category.categoryId + '</td>'
            +   '<td>' + escapeHtml(category.name) + '</td>'
            +   '<td>' + (escapeHtml(category.description) || '—') + '</td>'
            +   '<td>' + (counts[category.categoryId] || 0) + '</td>'
            +   '<td class="row-actions">'
            // 分类是全站共用的，没有"我的分类"这种说法，
            // 所以这里判断的是 isAdmin 而不是 canTouch —— 后者会多问一句"是不是本人"，
            // 而这个问题对分类根本无从谈起
            +     (isAdmin()
                    ? '<button onclick="openCategoryForm(' + category.categoryId + ')">编辑</button>'
                      + '<button class="danger" onclick="deleteCategory(' + category.categoryId + ')">删除</button>'
                    : '<span class="row-locked" title="分类只有管理员能改">—</span>')
            +   '</td>'
            + '</tr>').join('');
    }

    function openCategoryForm(categoryId) {
        const category = categoryId
            ? state.categories.find(c => c.categoryId === categoryId)
            : { name: '', description: '' };

        const body = ''
            + field('名称 *',
                '<input type="text" id="fName" maxlength="50" value="'
                + escapeHtml(category.name) + '">')
            + field('描述',
                '<input type="text" id="fDescription" maxlength="255" value="'
                + escapeHtml(category.description) + '">');

        openModal(categoryId ? '编辑分类' : '新增分类', body, async () => {
            const payload = {
                name: $('#fName').value.trim(),
                description: $('#fDescription').value.trim()
            };

            // 所有写接口都要说清"谁在操作"。没登录就不发请求 ——
            // 发过去也只会被后端回一句"缺少操作人ID"，不如提前说人话
            const me = getMe();
            if (!me) {
                toast('请先登录，再修改分类');
                return;
            }

            try {
                if (categoryId) {
                    payload.categoryId = categoryId;
                    await put(withQuery('/category/update', { operatorId: me.userId }), payload);
                } else {
                    await post(withQuery('/category/add', { operatorId: me.userId }), payload);
                }
                toast('已保存', 'ok');
                closeModal();
                await loadAll();
            } catch (e) {
                toast(e.message, 'err');
            }
        });
    }

    async function deleteCategory(categoryId) {
        if (!confirm('确定删除这个分类吗？\n如果下面还有文章，后端会拒绝 —— 要先把那些文章改到别的分类。')) {
            return;
        }
        const me = getMe();
        if (!me) {
            toast('请先登录，再删除分类');
            return;
        }
        try {
            await del(withQuery('/category/' + categoryId, { operatorId: me.userId }));
            toast('已删除', 'ok');
            await loadAll();
        } catch (e) {
            toast(e.message, 'err');
        }
    }

    // ==================== 三、标签 ====================

    function renderTags() {
        const tbody = $('#tagRows');

        if (!state.tags.length) {
            tbody.innerHTML = '<tr><td colspan="3" class="table-empty">还没有标签</td></tr>';
            return;
        }

        tbody.innerHTML = state.tags.map(tag => ''
            + '<tr>'
            +   '<td>' + tag.tagId + '</td>'
            +   '<td>' + escapeHtml(tag.name) + '</td>'
            +   '<td class="row-actions">'
            // 和分类同理：标签也没有主人
            +     (isAdmin()
                    ? '<button onclick="openTagForm(' + tag.tagId + ')">编辑</button>'
                      + '<button class="danger" onclick="deleteTag(' + tag.tagId + ')">删除</button>'
                    : '<span class="row-locked" title="标签只有管理员能改">—</span>')
            +   '</td>'
            + '</tr>').join('');
    }

    function openTagForm(tagId) {
        const tag = tagId
            ? state.tags.find(t => t.tagId === tagId)
            : { name: '' };

        const body = field('名称 *',
            '<input type="text" id="fName" maxlength="50" value="'
            + escapeHtml(tag.name) + '">');

        openModal(tagId ? '编辑标签' : '新增标签', body, async () => {
            const payload = { name: $('#fName').value.trim() };

            const me = getMe();
            if (!me) {
                toast('请先登录，再修改标签');
                return;
            }

            try {
                if (tagId) {
                    payload.tagId = tagId;
                    await put(withQuery('/tag/update', { operatorId: me.userId }), payload);
                } else {
                    await post(withQuery('/tag/add', { operatorId: me.userId }), payload);
                }
                toast('已保存', 'ok');
                closeModal();
                await loadAll();
            } catch (e) {
                toast(e.message, 'err');
            }
        });
    }

    async function deleteTag(tagId) {
        if (!confirm('确定删除这个标签吗？\n贴了它的文章不会被删，只是这个标签从那些文章上摘掉。')) {
            return;
        }
        const me = getMe();
        if (!me) {
            toast('请先登录，再删除标签');
            return;
        }
        try {
            await del(withQuery('/tag/' + tagId, { operatorId: me.userId }));
            toast('已删除', 'ok');
            await loadAll();
        } catch (e) {
            toast(e.message, 'err');
        }
    }

    // ==================== 四、用户 ====================

    function renderUsers() {
        const tbody = $('#userRows');

        if (!state.users.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="table-empty">还没有用户</td></tr>';
            return;
        }

        tbody.innerHTML = state.users.map(user => ''
            + '<tr>'
            +   '<td>' + user.userId + '</td>'
            +   '<td>' + escapeHtml(user.username) + '</td>'
            +   '<td>' + (escapeHtml(user.email) || '—') + '</td>'
            +   '<td>' + (user.role === 1
                    ? '<span class="badge badge-admin">管理员</span>'
                    : '普通用户') + '</td>'
            +   '<td>' + formatTime(user.createTime) + '</td>'
            +   '<td class="row-actions">'
            // 用户是有主人的数据，"主人"就是他本人，所以这里用 canTouch ——
            // 改自己的资料、删自己的账号都放行，动别人就得是管理员
            +     (canTouch(user.userId)
                    ? '<button onclick="openUserForm(' + user.userId + ')">编辑</button>'
                      + '<button class="danger" onclick="deleteUser(' + user.userId + ')">删除</button>'
                    : '<span class="row-locked" title="只有本人和管理员能改">—</span>')
            +   '</td>'
            + '</tr>').join('');
    }

    function openUserForm(userId) {
        const user = userId
            ? state.users.find(u => u.userId === userId)
            : { username: '', email: '', role: 0 };

        const roleSelect = '<select id="fRole">'
            + '<option value="0"' + (user.role !== 1 ? ' selected' : '') + '>普通用户</option>'
            + '<option value="1"' + (user.role === 1 ? ' selected' : '') + '>管理员</option>'
            + '</select>';

        const body = ''
            + field('用户名 *',
                '<input type="text" id="fUsername" maxlength="50" value="'
                + escapeHtml(user.username) + '"' + (userId ? ' disabled' : '') + '>'
                + (userId ? '<div class="field-hint">用户名注册后不能改</div>' : ''))
            + field('密码 ' + (userId ? '' : '*'),
                '<input type="password" id="fPassword" maxlength="100"'
                + ' placeholder="' + (userId ? '留空表示不改密码' : '') + '">')
            + field('邮箱',
                '<input type="email" id="fEmail" maxlength="100" value="'
                + escapeHtml(user.email) + '">')
            // 角色下拉框只给两种情况看：
            //   新增 —— /user/register 本来就是公开接口，能选角色是既有行为
            //   管理员编辑 —— 管理员本来就有权改任何人的角色
            // 普通用户编辑自己的资料时不给看。否则改个邮箱的顺手下拉里
            // 还摆着"管理员"这一项，等于给了一条自助提权的路。
            // 这一层是前端挡的；后端那边角色字段怎么处理的取舍，
            // 和注册接口是同一个问题，见 README
            + field('角色', (userId && !isAdmin())
                ? '<div class="field-hint">角色只有管理员能改</div>'
                : roleSelect);

        openModal(userId ? '编辑用户' : '新增用户', body, async () => {
            const password = $('#fPassword').value;

            const me = getMe();
            if (!me) {
                toast('请先登录，再保存');
                return;
            }

            // 上面那一段说明的落地：下拉框不在页面上，就不往下发 role 字段。
            // 后端见到 role 是 null 会沿用库里的原值，不会被清成 0
            const roleField = $('#fRole');
            const role = roleField ? Number(roleField.value) : null;

            try {
                if (userId) {
                    const payload = {
                        userId: userId,
                        email: $('#fEmail').value.trim()
                    };
                    if (role !== null) {
                        payload.role = role;
                    }
                    // 密码留空就整个字段都不传，后端会保留原密码。
                    // 传个空串过去会被 @Size 之外的服务层逻辑判成"改成空密码"
                    if (password) {
                        payload.password = password;
                    }
                    await put(withQuery('/user/update', { operatorId: me.userId }), payload);
                } else {
                    await post('/user/register', {
                        username: $('#fUsername').value.trim(),
                        password: password,
                        email: $('#fEmail').value.trim(),
                        role: role === null ? 0 : role
                    });
                }
                toast('已保存', 'ok');
                closeModal();
                await loadAll();
            } catch (e) {
                toast(e.message, 'err');
            }
        });
    }

    async function deleteUser(userId) {
        const me = getMe();
        if (me && me.userId === userId) {
            // 删掉自己之后身份就失效了，不如先拦住 —— 这不是后端规则，
            // 纯粹是前端不想让你把自己弄进一个尴尬的状态
            toast('不能删掉当前正在用的身份，先换个身份再删');
            return;
        }

        if (!confirm('确定删除这个用户吗？\n如果他还写过文章，后端会拒绝 —— 要先把那些文章处理掉。')) {
            return;
        }
        const me2 = getMe();
        if (!me2) {
            toast('请先登录，再删除用户');
            return;
        }
        try {
            await del(withQuery('/user/' + userId, { operatorId: me2.userId }));
            toast('已删除', 'ok');
            await loadAll();
        } catch (e) {
            toast(e.message, 'err');
        }
    }

    init();
</script>
</body>
</html>
