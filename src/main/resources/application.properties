spring.application.name=Mygit

# ============================================================
# 数据源配置（连接本地 MySQL）
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/knowledge_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 密码不写在这里！写在同目录的 application-local.properties 里，
# 那个文件已被 .gitignore 排除，不会提交到 Gitee。

# 引入本地私有配置文件（optional: 表示文件不存在时也不报错）
spring.config.import=optional:classpath:application-local.properties

# ============================================================
# MyBatis 配置
# ============================================================
# XML 映射文件的位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类所在包，这样 XML 里可以直接写类名（如 Article），不用写全限定名
mybatis.type-aliases-package=cuit.mygit.entity
# 自动把数据库的下划线字段名转成 Java 的驼峰名（user_id → userId）
mybatis.configuration.map-underscore-to-camel-case=true
# 在控制台打印实际执行的 SQL，方便调试
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
